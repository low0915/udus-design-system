<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuDu AI Design System</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components/bundle.css">
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <img class="logo logo-dark" src="../assets/Logos/logo-white.svg" alt="SuDu AI">
      <img class="logo logo-light" src="../assets/Logos/logo-dark.svg" alt="SuDu AI">
      <p class="eyebrow">DESIGN SYSTEM <span>v0.3.0</span></p>
      <label class="search-label" for="search">Find a preview</label>
      <input id="search" type="search" placeholder="Search previews" autocomplete="off">
      <nav id="navigation" aria-label="Design system previews"></nav>
      <a class="guide" href="../README.md">Read the design guide ↗</a>
    </aside>
    <main>
      <header class="topbar">
        <div><span class="eyebrow">INTERACTIVE REFERENCE</span><h1 id="title">Workspace</h1></div>
        <button id="theme" type="button" aria-label="Switch to light theme">Light theme</button>
      </header>
      <div class="content">
        <p id="description" class="description"></p>
        <div id="notice" class="notice" hidden></div>
        <div class="preview-frame"><iframe id="preview" title="Design system preview"></iframe></div>
        <p class="footnote">Preview uses the design system's original examples. The workspace uses simulated data and actions.</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
